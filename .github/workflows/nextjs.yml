name: Pages - Static dashboard deploy (v2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate dashboard source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -s index.html
          grep -qi '<html' index.html

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          install -m 0644 index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -f _site/.nojekyll
          echo "Static Pages artifact prepared:"
          find _site -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4
